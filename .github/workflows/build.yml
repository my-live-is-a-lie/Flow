name: Android CI/CD

on:
  push:
    branches: [ feature/because-you-watched ]
  workflow_dispatch:

# Collapse superseded runs on the branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Certificate of the official Flow release key. IzzyOnDroid and every
  # installed client pin this value; an APK signed with anything else cannot
  # be installed as an update. Changing it forces every user to reinstall.
  EXPECTED_SIGNER_SHA256: 4322294ed4caa2d4294140095818080ffe8acc1fbe3cdc76107df45c5286be40

# checks, tests, lint and build run on separate runners at the same time.
# The CI Gradle properties replace the --max-workers=1 that #1011 needed
# when everything shared one runner.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # Spotless ratchetFrom compares against an old commit.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      # Read-only: every job writes its own Gradle User Home entry, and the
      # repository cache is already at its 10 GB cap. This job restores from
      # the build job's entry instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check generated Snowball stemmers
        run: |
          sh scripts/neuro/gen_snowball.sh
          git status --porcelain -- app/src/main/java/org/tartarus/snowball
          test -z "$(git status --porcelain -- app/src/main/java/org/tartarus/snowball)"

      # The nightly job publishes these as the release body the update screen shows.
      - name: Check nightly notes
        run: python3 .github/scripts/nightly_notes.py --check

      - name: Check Kotlin formatting
        run: >
          ./gradlew spotlessCheck
          --build-cache --stacktrace

  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Instrumentation tests are not executed in CI, but they must still
      # compile: breakage here otherwise lands on main unnoticed.
      - name: Run unit tests and compile instrumentation tests
        run: >
          ./gradlew :app:testGithubDebugUnitTest :app:testFossDebugUnitTest
          :app:compileGithubDebugAndroidTestKotlin
          --build-cache --stacktrace

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      # Read-only for the same reason as the checks job. Lint is never the
      # slowest job, so re-downloading its own dependencies costs no wall time.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint GitHub nightly
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: >
          ./gradlew :app:lintGithubNightly
          --build-cache --stacktrace

      - name: Lint GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: >
          ./gradlew :app:lintGithubRelease
          --build-cache --stacktrace

  # "Build APK" is the required status check in the Protect Main ruleset.
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          elif [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            # A tag build publishes to GitHub Releases and IzzyOnDroid. Without
            # the keystore, app/build.gradle.kts falls back to signingConfig =
            # null and produces UNSIGNED APKs, which cannot be installed and
            # would break the update path for every existing user.
            echo "::error::RELEASE_KEYSTORE_BASE64 is unavailable for a tag build. Refusing to publish unsigned APKs."
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release keystore secret is not available. Continuing with an unsigned CI build."
          fi

      # Branch-only: no nightly keystore on this branch. The release build below
      # is unsigned when RELEASE_KEYSTORE_BASE64 is absent (see Decode Keystore).
      - name: Build arm64 release APK
        run: >
          ./gradlew :app:assembleGithubRelease
          --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      # Guards the update path: a wrong or missing key here is unrecoverable for
      # installed users, so fail the build rather than publish. Skipped when no
      # keystore was available, e.g. on fork PRs. Branch-only: the expected
      # signer below is the official Flow key; a fork signing with its own key
      # must update EXPECTED_SIGNER_SHA256 or drop this step.
      - name: Verify release signing certificate
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        run: |
          set -uo pipefail
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in the runner Android SDK."
            exit 1
          fi

          apks=(
            app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk
          )

          status=0
          for apk in "${apks[@]}"
          do
            if [ ! -f "$apk" ]; then
              echo "::error::Missing expected APK $apk"
              status=1
              continue
            fi
            actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            if [ "$actual" != "$EXPECTED_SIGNER_SHA256" ]; then
              echo "::error::$(basename "$apk") is signed with '$actual', expected '$EXPECTED_SIGNER_SHA256'"
              status=1
            else
              echo "OK $(basename "$apk") -> $actual"
            fi
          done
          exit $status

      - name: Report individual APK sizes
        shell: bash
        run: |
          shopt -s nullglob
          apks=(
            app/build/outputs/apk/github/release/app-github-arm64-v8a-release*.apk
          )
          expected=1

          if (( ${#apks[@]} != expected )); then
            printf 'Expected %d published APKs, found %d.\n' "$expected" "${#apks[@]}" >&2
            exit 1
          fi

          {
            echo '## Individual APK sizes'
            echo
            echo '| APK | Size | Exact bytes |'
            echo '|---|---:|---:|'
            for apk in "${apks[@]}"; do
              bytes=$(stat --format='%s' "$apk")
              size=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f MiB", bytes / 1048576 }')
              printf '| `%s` | %s | %s |\n' "$(basename "$apk")" "$size" "$bytes"
            done
            echo
            echo '> Release APKs are uploaded individually without compression.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GitHub ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: flow-github-arm64-release-apk
          path: app/build/outputs/apk/github/release/app-github-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # Crash reports name the R8 map id in every frame; the matching mapping turns them back into
      # source lines with retrace. Kept longer than the APKs because reports arrive weeks later.
      - name: Upload R8 mappings
        uses: actions/upload-artifact@v7
        with:
          name: flow-r8-mappings
          path: app/build/outputs/mapping/*/mapping.txt
          if-no-files-found: warn
          retention-days: 90

